<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz Engine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- =========================
       PROFILE SELECTION
       ========================= -->
  <div id="profileBlock">
    <h3>Select Profile</h3>

    <div>
      <label for="profileSelect">Profile:</label>

      <select id="profileSelect">
        <option value="">Loading profiles...</option>
      </select>

      <button id="loadProfileBtn" type="button">
        Load Profile
      </button>
    </div>

    <div id="profileStatus" style="margin-top:10px;"></div>
  </div>


  <!-- =========================
       QUIZ SETUP
       Hidden until a profile
       has been selected
       ========================= -->
  <div id="quizSetupBlock" style="display:none;">

    <h3>Check your knowledge</h3>

    <div>
      <b>Note:</b> select options before loading quiz:
    </div>

    <div style="display:flex; gap:20px; align-items:center; margin-top:10px; flex-wrap:wrap;">

      <label>
        <input type="checkbox" id="shuffleToggle">
        Shuffle questions
      </label>

      <label>
        <input type="checkbox" id="shuffleAnswersToggle">
        Shuffle answers
      </label>

    </div>


    <div style="display:flex; gap:20px; align-items:center; margin-top:10px; flex-wrap:wrap;">

      <label>
        <input type="checkbox" id="autoReadToggle">
        Auto Reading
      </label>

      <label>
        <input type="checkbox" id="voiceToggle">
        Voice Recognition
      </label>

    </div>


    <!-- Quiz selection -->
    <div style="margin-top:10px;">

      <label for="quizFileSelect">
        Quiz:
      </label>

      <select id="quizFileSelect">

        <option value="quizzes/PEGACPBA25V1.txt">
          PegaCPBA_25
        </option>

        <option value="quizzes/PEGACPBA25V1_2.txt">
          PegaCPBA_25_2
        </option>

        <option value="quizzes/PEGACPBA24V1.txt">
          PegaCPBA_24
        </option>

        <option value="quizzes/GH-900.txt">
          GitHub Foundation
        </option>

        <option value="quizzes/GH-300.txt">
          GitHub Copilot
        </option>

      </select>

      <button id="loadQuizFileBtn" type="button" style="width:100px;">
        Load
      </button>

      <span style="margin:0 5px;">
        or
      </span>

      <input
        type="file"
        id="fileInput"
        accept=".txt"
        title="Upload a Quiz File (.txt)"
      >

    </div>

  </div>


  <!-- =========================
       QUIZ NAVIGATION
       ========================= -->
  <div
    class="nav-buttons"
    style="margin-top:20px;"
  >

    <button id="prevBtn" type="button">
      Previous
    </button>

    <button id="nextBtn" type="button">
      Next
    </button>

  </div>


  <!-- =========================
       QUIZ
       ========================= -->
  <div
    id="quizContainer"
    style="margin-top:20px;"
  ></div>


  <!-- =========================
       QUIZ ACTIONS
       ========================= -->
  <div
    class="nav-buttons"
    style="margin-top:20px;"
  >

    <button
      id="finishQuizBtn"
      type="button"
    >
      Finish Quiz
    </button>

    <button
      id="restart"
      type="button"
    >
      Restart Quiz
    </button>

  </div>


  <!-- =========================
       FINAL SCORE
       ========================= -->
  <div
    id="finalScore"
    style="margin-top:10px;"
  ></div>


  <!-- =========================
       QUIZ SUMMARY
       ========================= -->
  <div
    id="quizSummary"
    style="margin-top:20px; display:none;"
  >

    <details open>

      <summary>
        🧾 Summary:
      </summary>

      <ul
        id="summaryList"
        class="summary-columns"
      ></ul>

    </details>

  </div>


  <!-- =========================
       VOICE OUTPUT
       ========================= -->
  <div
    id="voiceOutput"
    style="margin-top:1em; font-style:italic;"
  ></div>


  <!-- =========================
       JAVASCRIPT
       ========================= -->
  <script src="github.js"></script>
  <script src="quiz.js"></script>

</body>
</html>
